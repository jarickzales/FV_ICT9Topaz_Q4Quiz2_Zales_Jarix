<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .subject{
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 70px;
        }
        *{
            text-align: center;
        }
        input[type="number"] {
            border: 0.5px solid #000000;
        }
        .subj{
            padding: 10px;
        }
        .subject-image {
            width: 400px;    
            height: 400px;
            object-fit: cover; 
        }
        #button{
            width: 400px;
            height: 60px;
            font-size: 30px;
            background: linear-gradient(45deg, red, orange, yellow, green, blue, indigo, violet, red);
            color: rgb(255, 255, 255);
        }
        #button:hover{
            color:rgb(7, 7, 7)
        }
        
        #title{
            background: linear-gradient(45deg, red, orange, yellow, green, blue, indigo, violet, red);
            color: white;
        }

    </style>
</head>
<body>
    <br><br>
    <center>
<h1 id="title">Grade Calculator</h1>
<details ontoggle="message1()">
    <summary>
        <u>Instructions</u>
        <br>
    </summary>
    <i id="message"></i>
</details>

<div class="subject">
    <div class="subj col-md-3">
        <img src="https://ih1.redbubble.net/image.848786813.7072/flat,750x,075,f-pad,750x1000,f8f8f8.jpg" alt="Science" height="100%" width="80%" class="subject-image">
        <input type="number" class="form-control" placeholder="Enter your grade..." id="num1">
    </div>
    <div class="subj col-md-3">
        <img src="https://img.freepik.com/premium-vector/math-icon-with-formular-tools_1639-26099.jpg?semt=ais_hybrid&w=740" alt="Science" height="100%" width="80%" class="subject-image">
        <input type="number" class="form-control" placeholder="Enter your grade..." id="num2">
    </div>
    <div class="subj col-md-3">
        <img src="https://static.vecteezy.com/system/resources/previews/017/300/766/non_2x/learning-english-doodle-set-language-school-in-sketch-style-online-language-education-course-hand-drawn-illustration-isolated-on-white-background-vector.jpg" alt="Science" height="100%" width="80%" class="subject-image">
        <input type="number" class="form-control" placeholder="Enter your grade..." id="num3">
    </div>
</div>
<br><br>
    <button type="button" class="form-control btn btn-primary" id="button" onclick="calc()">Calculate your grade</button>
    <br>
    

</center>
    <script>

        function message1(){
            document.getElementById("message").innerHTML = "Put in your respective scores for the subjects then press the button!";
        }

        function calc(){
    let num1 = document.getElementById("num1").value;
    let num2 = document.getElementById("num2").value; 
    let num3 = document.getElementById("num3").value; 

    let av = Number(num1) + Number(num2) + Number(num3);
    let av1 = av/3;
    let avg = Math.round(av1 * 100) / 100;

    switch(true){
    case avg>= 70 && avg <= 74.99:
        alert("Your average is " + avg + ". It is poor.");
        break;
    case avg>= 75 && avg <= 79.99:
        alert("Your average is " + avg + ". It needs improvement.");
        break;
    case avg>= 80 && avg <= 86.99:
        alert("Your average is " + avg + ". It is satisfactory.");
        break;
    case avg>= 87 && avg <= 93.99:
        alert("Your average is " + avg + ". It is above satisfactory.");
        break;
    case avg>= 94 && avg <= 100:
        alert("Your average is " + avg + ". It is excellent.");
        break;
    default:
        alert("Please enter your grades.");
    }
}



        /*let num1 = 2

        switch(true){
            case num1 > 1 || num1 <= 2:
                alert("You got it!");
                break;
            default:
                alert("No Number to display");
        }*/
    </script>
</body>
</html>
